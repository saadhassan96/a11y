name: Deploy website to GitHub Pages

# The current site (index.html, css/, js/, images/) is plain HTML and needs
# no build. The old Hugo site lives in archive/ and is built to /archive/.

env:
  WC_HUGO_VERSION: '0.119.0'

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo (for the archived site)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true

      - uses: actions/cache@v4
        with:
          path: /tmp/hugo_cache_runner/
          key: ${{ runner.os }}-hugomod-${{ hashFiles('archive/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build archived site
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --source archive --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/archive/" \
            --destination "$GITHUB_WORKSPACE/_site/archive"

      - name: Add current site
        run: |
          rsync -a --exclude '.git*' --exclude '_site' --exclude 'archive' --exclude 'README.md' ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
